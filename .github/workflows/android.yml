name: Android

# 构建 release APK。
# - 推 tag(v*)时自动构建,并把 APK 挂到对应的 GitHub Release
# - 也可以手动触发(workflow_dispatch),产物只留在 Actions 里
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 上传 release 附件

env:
  # 配了这些 secret 就用正式密钥签名;没配则退回 debug 签名(能装,不能上架)
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK / NDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" > /dev/null

      - name: 安装依赖
        run: npm ci

      - name: 生成原生工程
        run: |
          npx expo prebuild -p android --no-install
          # 只编 arm64(体积减一半以上,C++ 也快),并调大堆内存。
          # 用脚本而不是 echo >>,因为 prebuild 生成的文件末尾没有换行符。
          ./scripts/ci-tune-gradle.sh android/gradle.properties

      - name: 对齐版本号
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="$(node -p "require('./package.json').version")"
            echo "tag 不是 vX.Y.Z,回退到 package.json 版本 $VERSION"
          fi
          IFS=. read -r MAJ MIN PATCH <<< "$VERSION"
          CODE=$(( MAJ * 10000 + MIN * 100 + PATCH ))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('app.json','utf8'));
            d.expo.version='${VERSION}';d.expo.android=d.expo.android||{};d.expo.android.versionCode=${CODE};
            fs.writeFileSync('app.json', JSON.stringify(d,null,2)+'\n');"
          sed -i -E "s/(versionCode )[0-9]+/\1${CODE}/; s/(versionName )\"[^\"]*\"/\1\"${VERSION}\"/" android/app/build.gradle
          echo "构建版本 $VERSION(versionCode $CODE)"

      - name: 配置正式签名
        if: env.KEYSTORE_BASE64 != ''
        run: |
          cat > android/app/release.keystore.b64 <<< "$KEYSTORE_BASE64"
          base64 -d android/app/release.keystore.b64 > android/app/release.keystore
          rm android/app/release.keystore.b64
          python3 scripts/ci-signing.py android/app/build.gradle release.keystore

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 构建
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 命名产物
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ai-guide-photo-v${VERSION}.apk"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ai-guide-photo-v${{ env.VERSION }}
          path: dist/*.apk
          if-no-files-found: error

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "构建产物见下方附件。"
          gh release upload "$GITHUB_REF_NAME" "dist/ai-guide-photo-v${VERSION}.apk" --clobber

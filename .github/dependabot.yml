version: 2
updates:
  # npm 依赖:每周一检查一次
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # 把 patch 级别的小更新合并成一个 PR,减少噪音
      patch:
        patterns: ['*']
        update-types: ['patch']
    commit-message:
      prefix: 'chore(deps)'

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
